<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Google - SIPERPU</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="google-auth.css">
</head>
<body class="google-auth-page">
  <main class="google-auth-shell">
    <div class="google-brand" aria-label="SIPERPU">
      <div class="google-brand-mark">S</div>
      <span>SIPERPU</span>
    </div>
    <section class="google-auth-card" aria-labelledby="login-title">
      <div class="google-auth-heading">
        <p class="google-eyebrow">Sistem Perpustakaan Kampus</p>
        <h1 id="login-title">Selamat datang kembali</h1>
        <p>Masuk untuk melanjutkan ke dashboard perpustakaan.</p>
      </div>
      <div id="google-login-button" class="google-login-button"></div>
      <p id="google-login-error" class="google-login-error" role="alert"></p>
      <p class="google-auth-note">Login menggunakan akun Google yang terdaftar pada aplikasi.</p>
      <a class="google-back-link" href="index.html">Kembali ke login lama</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="google-auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initializeGoogleLogin()"></script>
</body>
</html>
