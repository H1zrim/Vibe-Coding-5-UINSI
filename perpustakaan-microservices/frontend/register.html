<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registrasi - SIPERPU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-container">
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Registrasi Pengunjung</h2>
          <p>Isi formulir untuk membuat akun pengunjung (mahasiswa).</p>
        </div>
        <form id="full-register-form" class="login-form">
          <div class="form-group">
            <label for="r-email">Email</label>
            <input id="r-email" type="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="r-password">Password</label>
            <input id="r-password" type="password" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="r-name">Nama Lengkap</label>
            <input id="r-name" type="text" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="r-phone">No. HP</label>
            <input id="r-phone" type="text" class="form-control">
          </div>
          <div class="form-group">
            <label for="r-address">Alamat</label>
            <input id="r-address" type="text" class="form-control">
          </div>
          <div class="form-group">
            <label for="r-nim">NIM (opsional)</label>
            <input id="r-nim" type="text" class="form-control">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrasi & Masuk</button>
            <a href="index.html" class="btn btn-outline-secondary">Kembali ke Login</a>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script>
    const API_BASE = (window.API_CONFIG && window.API_CONFIG.USER_SERVICE) || 'http://localhost:4001';
    async function apiRequest(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, { headers: { 'Content-Type': 'application/json' }, ...options });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.message) || `Request failed ${res.status}`);
      return data;
    }

    document.getElementById('full-register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-password').value.trim();
      const name = document.getElementById('r-name').value.trim();
      const phone = document.getElementById('r-phone').value.trim();
      const address = document.getElementById('r-address').value.trim();
      const nim = document.getElementById('r-nim').value.trim();
      try {
        const user = await apiRequest('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email, password, name, phone, address, nim })
        });
        localStorage.setItem('siperpu_current_user', JSON.stringify(user));
        window.location.href = 'index.html';
      } catch (err) {
        alert(err.message || 'Gagal registrasi');
      }
    });
  </script>
</body>
</html>
